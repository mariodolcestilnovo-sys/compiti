/* Grafica di Il viaggio italiano: carta chiara, viola, oro e menta, bottoni in rilievo. Una colonna da telefono. */
:root{
  --paper:#fffaf4; --purple:#9c4498; --purple-dark:#722b72; --deep:#421c42; --teal:#07303a; --mint:#cdf4e5; --mint-line:#61b69e;
  --gold:#fcbb47; --pink:#f6d8e6; --line:#eaded2; --edge:#e9ddd4; --retry:#fff0ce; --retry-line:#e5bc69; --soft:#726375; --white:#fffefb;
  --shadow:0 8px 0 #e8dbc9,0 18px 40px #62395912;
}
body{background:var(--paper);color:var(--teal);font:400 18px/1.45 Jost,'Futura PT',Futura,'Century Gothic',Arial,sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
*{box-sizing:border-box}
.wrap{max-width:560px;margin:0 auto;padding-block:12px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:16px}
.box{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);padding-block:8px;display:grid;grid-template-columns:repeat(6,1fr);gap:8px;justify-items:center}
.slot{aspect-ratio:1;width:100%;max-width:50px;border-radius:50%;border:2px dashed var(--edge);display:grid;place-items:center;color:#c9b8ab;background:var(--white)}
.slot svg{width:56%;height:56%}
.slot.now{border:2px solid var(--purple);color:var(--purple)}
.slot.full{border:2px solid #fffaf4;background:var(--gold);color:var(--deep);box-shadow:0 3px 0 #d99a2b}
.slot.full.pop{animation:pop .5s ease}
@keyframes pop{0%{transform:scale(.4)}70%{transform:scale(1.18)}100%{transform:scale(1)}}
@keyframes arrive{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.card{background:var(--white);border-radius:22px;box-shadow:var(--shadow);padding:20px;display:grid;gap:14px;min-width:0}
h1,h2{font-family:Raleway,Arial,sans-serif;font-weight:700;margin:0;line-height:1.12;color:var(--deep);text-wrap:balance}
h1{font-size:clamp(29px,7vw,40px)} h2{font-size:24px}
p{margin:0}
.kind{font-size:12px;font-weight:600;letter-spacing:2px;text-transform:uppercase;color:var(--purple)}
.bg{color:var(--soft);font-size:15px}
.nonna{background:var(--pink);color:var(--deep);border-radius:18px;padding:12px 14px;animation:arrive .25s ease-out}
.nonna b{font-weight:600}

button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent;overflow-wrap:anywhere;max-width:100%}
button:focus-visible,input:focus-visible,textarea:focus-visible,summary:focus-visible{outline:3px solid var(--purple);outline-offset:2px}
.go{background:var(--purple);color:#fff;border:0;border-radius:18px;padding:14px 18px;font-weight:600;min-height:54px;width:100%;box-shadow:0 5px 0 var(--purple-dark);transition:transform .15s,box-shadow .15s}
.go:active{transform:translateY(4px);box-shadow:0 1px 0 var(--purple-dark)}
.go:disabled{opacity:.45;cursor:default;transform:none}
.ghost{background:#f3e9ef;color:var(--deep);border:0;border-radius:18px;padding:10px 16px;font-weight:600;min-height:46px}
.row{display:flex;flex-wrap:wrap;gap:8px}
.opt{display:block;width:100%;text-align:left;background:var(--white);color:var(--teal);border:2px solid var(--edge);border-radius:16px;box-shadow:0 4px 0 var(--edge);padding:12px 16px;min-height:52px;font-weight:600;font-size:16px;transition:transform .15s,background .15s}
.opt:active{transform:translateY(3px)}
.opt.right{background:var(--mint);border-color:var(--mint-line);box-shadow:0 4px 0 var(--mint-line)}
.opt.wrong{background:var(--retry);border-color:var(--retry-line);box-shadow:0 4px 0 var(--retry-line)}
.opt.sel{border-color:var(--purple);box-shadow:0 4px 0 var(--purple)}
.opt.done{opacity:.8}
.list{display:grid;gap:10px}
.pairs{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pairs>div{display:grid;gap:10px;align-content:start;min-width:0}
.fb{border-radius:18px;padding:12px 14px;font-size:16px;animation:arrive .25s ease-out}
.fb.good{background:var(--mint);color:var(--teal)} .fb.bad{background:var(--retry);color:var(--deep)}
.story{line-height:2.3}
.story input{font:inherit;color:var(--teal);background:var(--paper);border:2px solid var(--edge);border-radius:10px;padding:0 6px;width:7.2em;max-width:100%;height:2em}
.story input.ok{border-color:var(--mint-line);background:var(--mint)}
.story input.no{border-color:var(--retry-line);background:var(--retry)}
.story small{color:var(--soft)}
textarea{font:inherit;color:var(--teal);background:var(--paper);width:100%;min-height:130px;border:2px solid var(--edge);border-radius:16px;padding:12px;resize:vertical}
.field.wide{width:100%;text-transform:none;letter-spacing:0;font-weight:400}
.field{font:inherit;color:var(--deep);background:var(--paper);border:2px solid var(--edge);border-radius:14px;padding:10px;width:8em;text-transform:uppercase;font-weight:600;letter-spacing:.1em}
label{font-weight:600}
.words{display:flex;flex-wrap:wrap;gap:6px}
.word{background:var(--white);color:var(--teal);border:2px solid var(--edge);border-radius:999px;padding:6px 12px;min-height:42px}
.word.on{background:var(--gold);border-color:#d99a2b;color:var(--deep)}
.score{display:grid;grid-template-columns:1fr auto;gap:6px 14px;font-variant-numeric:tabular-nums}
.score b{font-weight:600}
.can{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.can li{padding-left:26px;position:relative}
.can li::before{content:"";position:absolute;left:2px;top:.35em;width:14px;height:14px;border-radius:50%;background:var(--mint-line)}
.can li.todo::before{background:transparent;border:2px solid var(--retry-line)}
.letter{border:2px dashed var(--purple);border-radius:18px;padding:16px;background:var(--pink);color:var(--deep);font-size:19px}
.fine{color:var(--soft);font-size:14px}
details summary{cursor:pointer;font-weight:600;color:var(--purple)}
audio{width:100%}
.confetti{position:fixed;top:-14px;width:9px;height:14px;border-radius:2px;z-index:20;pointer-events:none;animation:fall 2.4s ease-in forwards}
@keyframes fall{to{transform:translateY(105vh) rotate(420deg);opacity:.2}}
@media (prefers-reduced-motion:reduce){.slot.full.pop,.nonna,.fb,.helper{animation:none}.confetti{display:none}}
</style></head>
<body>
<div class="wrap">
  <div class="box" id="box" aria-label="La scatola dei ricordi"></div>
  <main id="app" aria-live="polite"></main>
</div>
<script>
const IC={
  letter:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="6" width="18" height="13" rx="1"/><path d="M3 7l9 7 9-7"/></svg>',
  coin:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 5v14M8.5 8v8M15.5 8v8"/></svg>',
  tv:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="8" width="18" height="12" rx="2"/><path d="M8 3l4 5 4-5"/></svg>',
  photo:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="16" rx="1"/><circle cx="9" cy="10" r="2"/><path d="M3 18l6-5 4 3 3-2 5 4"/></svg>',
  pen:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 20l1-5L16 4l4 4L9 19z"/></svg>',
};
const ICONE={ascolto:'letter',logica:'coin',cultura:'tv',verbi:'photo',scritto:'pen'};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const $=s=>document.querySelector(s);
const S={T:null,i:-1,codice:'',email:'',corso:'',fatte:{},tentativi:{ascolto:[],cultura:[],logica:[],verbi:{}},scritto:'',aiuto:false,inizio:0,esito:null,pop:-1};

const INDIRIZZO_SERVIZIO='https://script.google.com/macros/s/AKfycbwmwkU96fFahUw1h8uUQxZznpY8TdZI-YjXu70DgnlncDtOgiZlBQt4Gxe8JSxSHKnetQ/exec';
const api=async(azione,...argomenti)=>{
  if(window.FINTO_SERVIZIO)return window.FINTO_SERVIZIO(azione,argomenti);
  const r=await fetch(INDIRIZZO_SERVIZIO,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({azione,argomenti})});
  if(!r.ok)throw new Error('Controlla la connessione e riprova.');
  const d=await r.json();
  if(d.errore)throw new Error(d.errore);
  return d.risultato;
};


function scatola(){
  if(!S.T){$('#box').innerHTML='';return}
  $('#box').innerHTML=S.T.prove.map((p,k)=>{const f=S.fatte[p.id];return '<div class="slot'+(f?' full':'')+(S.pop===k?' pop':'')+(S.i===k&&!f?' now':'')+'" role="img" aria-label="'+esc(f?p.ricordo:'Ricordo ancora da trovare')+'">'+IC[ICONE[p.id]]+'</div>'}).join('');
  S.pop=-1;
}
function disegna(){
  scatola();const a=$('#app');a.innerHTML='';
  if(!S.T){a.innerHTML='<section class="card"><p>Sto aprendo la scatola...</p></section>';return}
  if(S.i<0)return intro(a);
  if(S.i>=S.T.prove.length)return fine(a);
  const p=S.T.prove[S.i];({chiusa,collegamenti,verbi,scritto})[p.tipo](a,p);
  window.scrollTo&&window.scrollTo(0,0);
}
function scheda(p){
  const c=document.createElement('section');c.className='card';
  c.innerHTML='<div class="kind">'+esc(p.nome)+' · prova '+(S.i+1)+' di '+S.T.prove.length+'</div><h2>'+esc(p.titolo)+'</h2><p>'+esc(p.obiettivo)+'</p><p class="bg" lang="bg">'+esc(p.bg)+'</p>';
  return c;
}
function errore(c,msg){const n=document.createElement('div');n.className='fb bad';n.textContent=msg||'Qualcosa non ha funzionato. Controlla la connessione e riprova.';c.append(n)}
function completa(p,extra){
  S.fatte[p.id]=true;S.pop=S.i;scatola();
  const c=$('#app .card'),r=document.createElement('div');r.className='list';
  r.innerHTML='<div class="nonna"><b>Nonna Lucia:</b> '+esc(p.reazione)+'</div><p>Nella scatola c\'è '+esc(p.ricordo)+'.</p>';
  const b=document.createElement('button');b.className='go';b.id='next';
  const ultima=S.i===S.T.prove.length-1;b.textContent=ultima?'Apri la lettera':'Prossimo ricordo';
  b.onclick=async()=>{
    if(!ultima){S.i++;disegna();return}
    b.disabled=true;b.textContent='Sto salvando...';
    try{S.esito=await api('consegna',{codice:S.codice,email:S.email,corso:S.corso,tentativi:S.tentativi,scritto:S.scritto});S.i++;disegna()}
    catch(e){b.disabled=false;b.textContent='Riprova a salvare';errore(r,e&&e.message)}
  };
  r.append(b);c.append(r);b.focus({preventScroll:true});
}
function intro(a){
  a.innerHTML='<section class="card"><div class="hero"><div class="list"><div class="kind">Il viaggio italiano · Torino</div><h1>'+esc(S.T.titolo)+'</h1></div><div class="mole" role="img" aria-label="La Mole Antonelliana di Torino"></div></div>'+
  '<p>Nonna Lucia ha trovato una scatola di ricordi e una lettera mai aperta. Aiutala a rimettere in ordine i ricordi: alla fine scopri cosa c\'era scritto.</p>'+
  '<div class="nonna"><b>Cinque prove, circa 10 minuti.</b> Alla fine saprai raccontare il passato usando imperfetto e passato prossimo.</div>'+
  '<div class="list"><label for="code">Il tuo codice</label><input class="field" id="code" maxlength="4" autocomplete="off"><p class="bg" lang="bg">Първите 2 букви от името и първите 2 от фамилията (Иван Иванов = IVIV).</p>'+
  '<label for="mail">La tua email, per ricevere la nota</label><input class="field wide" id="mail" type="email" autocomplete="email"></div>'+
  '<details><summary>Chi corregge? Dove vanno le risposte?</summary><p class="bg" lang="bg">Този тест се проверява отчасти от автоматична система с изкуствен интелект. Обясненията и точките по упражненията получаваш веднага, но те не са написани от учителя или учителката.</p><p class="bg" lang="bg">Записите и отговорите се изтриват от нашата система след проверката. Писмените отговори се обработват от външни услуги с изкуствен интелект, включително Google, които могат да ги запазят и използват за подобряване на услугите си. Затова в отговорите не пиши лични данни. Имейлът ти не се предава на тези услуги.</p><p class="fine">Pagina di prova: usa solo dati inventati.</p></details>'+
  '<div id="err"></div><button class="go" id="begin">Apri la scatola</button></section>';
  $('#begin').onclick=()=>{
    const c=$('#code').value.trim().toUpperCase(),m=$('#mail').value.trim();
    if(!/^[A-ZА-Я]{2,4}$/.test(c)||!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(m)){$('#err').innerHTML='<div class="fb bad">Scrivi il codice di 4 lettere e la tua email.</div>';return}
    S.codice=c;S.email=m;S.i=0;S.inizio=Date.now();disegna();
  };
}
function chiusa(a,p){
  const c=scheda(p);
  if(p.testo){const t=document.createElement('div');t.className='nonna';t.textContent=p.testo;c.append(t)}
  if(p.domanda){const q=document.createElement('p');q.innerHTML='<b>'+esc(p.domanda)+'</b>';c.append(q)}
  const l=document.createElement('div');l.className='list',fb=document.createElement('div');let finita=false;
  p.opzioni.forEach((t,k)=>{const b=document.createElement('button');b.className='opt';b.textContent=t;
    b.onclick=async()=>{if(finita||b.disabled)return;b.disabled=true;
      try{const r=await api('controllaChiusa',p.id,k);S.tentativi[p.id].push(k);
        if(r.ok){finita=true;b.classList.add('right');fb.className='fb good';fb.textContent=r.messaggio;completa(p)}
        else{b.classList.add('wrong');fb.className='fb bad';fb.textContent=r.messaggio}
      }catch(e){b.disabled=false;fb.className='fb bad';fb.textContent='Controlla la connessione e riprova.'}};
    l.append(b)});
  c.append(l,fb);a.append(c);
}
function collegamenti(a,p){
  const c=scheda(p),w=document.createElement('div');w.className='pairs';const L=document.createElement('div'),R=document.createElement('div'),fb=document.createElement('div');let sel=null,fatte=0;
  p.inizi.forEach((t,k)=>{const b=document.createElement('button');b.className='opt';b.textContent=t;b.dataset.k=k;b.onclick=()=>{if(b.disabled)return;L.querySelectorAll('.sel').forEach(x=>x.classList.remove('sel'));b.classList.add('sel');sel=b};L.append(b)});
  p.fini.forEach(t=>{const b=document.createElement('button');b.className='opt';b.textContent=t;
    b.onclick=async()=>{if(!sel){fb.className='fb bad';fb.textContent='Prima tocca un inizio di frase.';return}
      const s=sel,k=+s.dataset.k;
      try{const r=await api('controllaCoppia',k,t);S.tentativi.logica.push([k,t]);
        if(r.ok){s.classList.remove('sel');s.classList.add('right','done');s.disabled=true;b.classList.add('right','done');b.disabled=true;sel=null;fatte++;fb.className='fb good';fb.textContent=r.messaggio;if(fatte===p.inizi.length)completa(p)}
        else{fb.className='fb bad';fb.textContent=r.messaggio}
      }catch(e){fb.className='fb bad';fb.textContent='Controlla la connessione e riprova.'}};
    R.append(b)});
  w.append(L,R);c.append(w,fb);a.append(c);
}
function verbi(a,p){
  const c=scheda(p),s=document.createElement('p');s.className='story';let h=esc(p.parti[0]);
  p.verbi.forEach((v,k)=>{h+='<input id="b'+k+'" aria-label="Verbo '+esc(v)+'" autocomplete="off" autocapitalize="off" spellcheck="false"> <small>('+esc(v)+')</small>'+esc(p.parti[k+1])});
  s.innerHTML=h;c.append(s);
  const hr=document.createElement('div');hr.className='row';const hb=document.createElement('button');hb.className='ghost';let lv=0;hb.textContent='Aiuto: '+p.aiuti[0][0];const hbox=document.createElement('div');hbox.className='list';
  hb.onclick=()=>{if(lv>=p.aiuti.length)return;S.aiuto=true;const n=document.createElement('div');n.className='nonna helper';n.innerHTML='<span class="bust" role="img" aria-label="Maria Montessori"></span><div><b>Maria Montessori · '+esc(p.aiuti[lv][0])+'</b><br>'+esc(p.aiuti[lv][1])+'</div>';hbox.append(n);lv++;if(lv<p.aiuti.length)hb.textContent='Aiuto: '+p.aiuti[lv][0];else hb.disabled=true};
  hr.append(hb);c.append(hr,hbox);
  const fb=document.createElement('div');fb.className='list',go=document.createElement('button');go.className='go';go.textContent='Controlla';
  const st=p.verbi.map(()=>({n:0,fatto:false}));
  go.onclick=async()=>{go.disabled=true;fb.innerHTML='';let aperti=0;
    try{for(let k=0;k<p.verbi.length;k++){const i=$('#b'+k),z=st[k];if(z.fatto)continue;if(!i.value.trim()){aperti++;continue}
        z.n++;(S.tentativi.verbi[k]=S.tentativi.verbi[k]||[]).push(i.value);
        const r=await api('controllaVerbo',k,i.value,z.n);const n=document.createElement('div');
        if(r.ok){z.fatto=true;i.classList.remove('no');i.classList.add('ok');i.readOnly=true;if(r.nota){n.className='fb good';n.textContent=r.nota;fb.append(n)}}
        else if(r.soluzione){z.fatto=true;i.value=r.soluzione;i.classList.remove('no');i.classList.add('ok');i.readOnly=true;n.className='fb bad';n.textContent='La forma giusta è «'+r.soluzione+'». '+r.nota;fb.append(n)}
        else{i.classList.add('no');aperti++;n.className='fb bad';n.textContent=r.nota+' Riprova.';fb.append(n)}}
      if(aperti){go.disabled=false;if(!fb.children.length){const n=document.createElement('div');n.className='fb bad';n.textContent='Scrivi tutti i verbi, poi controlla.';fb.append(n)}return}
      go.hidden=true;hb.disabled=true;completa(p);
    }catch(e){go.disabled=false;errore(fb)}};
  c.append(fb,go);a.append(c);
}
const REFUSI={perche:'perché',piu:'più',citta:'città',gia:'già',pero:'però',cosi:'così',puo:'può',caffe:'caffè',anche_si:'anche se'};
function controllaTesto(t){
  const a=[],frasi=t.split(/[.!?]+/).map(x=>x.trim()).filter(x=>x.split(/\s+/).length>1).length;
  if(frasi<3)a.push('Hai scritto '+frasi+(frasi===1?' frase':' frasi')+': ne servono 3.');
  if(!/\b(ero|eri|era|eravamo|erano|\w+(avo|evo|ivo|avi|evi|ivi|ava|eva|iva|avamo|evamo|ivamo|avano|evano|ivano))\b/i.test(t))a.push('Racconta com\'era, usando l\'imperfetto: «ero», «abitavo»...');
  if(!/(^|[^\p{L}])(ho|hai|ha|abbiamo|avete|hanno|sono|sei|è|siamo|siete)\s+(\p{L}+\s+)?\p{L}+(ato|uto|ito|ata|uta|ita|ati|uti|iti|ate|ute|ite|tto|tta|sto|sta|so|sa)($|[^\p{L}])/iu.test(t))a.push('Racconta che cosa è successo un giorno, con il passato prossimo: «ho trovato», «sono andato/a»...');
  const r=[];for(const k in REFUSI){if(new RegExp('(^|[^\\p{L}])'+k.replace('_',' ')+'($|[^\\p{L}])','iu').test(t))r.push('«'+REFUSI[k]+'»')}
  if(r.length)a.push('Controlla la scrittura: '+r.join(', ')+'.');
  return a;
}
function scritto(a,p){
  const c=scheda(p),t=document.createElement('textarea');t.id='ricordo';t.maxLength=3000;t.setAttribute('aria-label','Il tuo ricordo');t.placeholder='Quando ero piccolo/a...';
  const prova=document.createElement('button');prova.className='ghost';prova.textContent='Controlla il testo';prova.disabled=true;
  const fb=document.createElement('div');fb.className='list';
  const go=document.createElement('button');go.className='go';go.textContent='Manda il ricordo';go.disabled=true;
  t.oninput=()=>{const v=t.value.trim().length<15;prova.disabled=v;go.disabled=v};
  prova.onclick=()=>{fb.innerHTML='';const r=controllaTesto(t.value);
    if(!r.length){const n=document.createElement('div');n.className='fb good';n.textContent='Ci sono le frasi e i tempi richiesti. Puoi mandarlo.';fb.append(n)}
    r.forEach(x=>{const n=document.createElement('div');n.className='fb bad';n.textContent=x;fb.append(n)})};
  go.onclick=()=>{S.scritto=t.value.trim();t.readOnly=true;go.hidden=true;prova.hidden=true;completa(p)};
  const nota=document.createElement('p');nota.className='fine';nota.textContent='Questo controllo è automatico e semplice. La nota vera sul tuo testo ti arriva per email entro 24 ore.';
  c.append(t,prova,fb,nota,go);a.append(c);
}
function fine(a){
  const E=S.esito,T=S.T,min=Math.max(1,Math.round((Date.now()-S.inizio)/60000));
  const bene=id=>id==='scritto'?!!S.scritto:(E.punti[id]||0)>=Math.ceil(T.prove.find(p=>p.id===id).max/2);
  const righe=T.prove.filter(p=>p.id!=='scritto').map(p=>'<span>'+esc(p.nome)+'</span><b>'+(E.punti[p.id]||0)+' / '+p.max+'</b>').join('');
  const rip=E.ripasso.length?'<h2>Da riprendere</h2><ul class="can">'+E.ripasso.map(r=>'<li class="todo">'+esc(r)+'</li>').join('')+'</ul>':'<p>Non c\'è niente da riprendere: un percorso pulito.</p>';
  a.innerHTML='<section class="card"><div class="kind">Scatola completa</div><h1>La lettera, finalmente</h1><div class="letter">'+esc(T.lettera)+'</div>'+
   '<h2>In '+min+(min===1?' minuto':' minuti')+' ora sai</h2><ul class="can">'+T.saperi.map(x=>'<li'+(bene(x[0])?'':' class="todo"')+'>'+esc(x[1])+'</li>').join('')+'</ul>'+rip+
   '<h2>I tuoi punti</h2><div class="score">'+righe+'<span><b>Totale degli esercizi</b></span><b>'+E.totale+' / '+E.massimo+'</b></div>'+
   (E.scrittoInCoda?'<div class="nonna">Il tuo ricordo è arrivato. La nota ti arriverà per email entro 24 ore.</div>':'')+
   (S.aiuto?'<p class="bg">Hai usato gli aiuti. La prossima volta prova prima senza.</p>':'')+
   '<div class="nonna"><b>Vuoi allenare la pronuncia?</b> Installa la tastiera italiana e usa il suo microfono per dettare. Attenzione: la dettatura ha dei limiti. A volte parli bene e scrive male.</div><p class="bg" lang="bg">Искаш ли да упражняваш произношението? Инсталирай италианска клавиатура и диктувай с микрофона ѝ. Внимание: диктовката има ограничения. Понякога говориш добре, а тя пише грешно.</p>'+
   '<p class="fine">Spiegazioni e punti vengono da un sistema automatico. Questi punti non sono un voto.</p></section>';
  ['#9c4498','#fcbb47','#cdf4e5','#f6d8e6','#421c42'].forEach((col,k)=>{for(let n=0;n<6;n++){const d=document.createElement('i');d.className='confetti';d.style.left=(4+Math.random()*92)+'%';d.style.background=col;d.style.animationDelay=(k*.08+n*.14)+'s';d.addEventListener('animationend',()=>d.remove());document.body.append(d)}});
  window.scrollTo&&window.scrollTo(0,0);
}
disegna();
S.corso=new URLSearchParams(location.search).get('corso')||'';
api('leggiCompito').then(t=>{S.T=t;disegna()}).catch(()=>{$('#app').innerHTML='<section class="card"><div class="fb bad">La pagina non si è aperta. Ricarica tra poco.</div></section>'});
